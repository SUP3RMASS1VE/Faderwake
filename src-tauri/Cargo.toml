[package]
name = "faderwake"
version = "0.2.0"
description = "A desktop studio for mastering music"
edition = "2021"
publish = false

[[bin]]
name = "faderwake"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tempfile = "3"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
cpal = "0.15.3"
arc-swap = "1.7"
master-core = { path = "../crates/master-core" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
